# CI (PLANNING.md 2.19): build, typecheck, lint, format and test on every
# push to main and every pull request, on Linux, macOS and Windows across the
# Node versions Tyr supports.

name: CI

on:
    push:
        branches: [main]
    pull_request:
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    checks:
        name: Lint, format, typecheck
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v5
            - uses: actions/setup-node@v5
              with:
                  node-version: 22
                  cache: npm
            - run: npm ci
            - run: npm run typecheck
            - run: npm run lint
            - run: npm run format:check

    test:
        name: Test (${{ matrix.os }}, Node ${{ matrix.node }})
        runs-on: ${{ matrix.os }}
        timeout-minutes: 30
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, macos-latest, windows-latest]
                node: [22, 24]
        steps:
            - uses: actions/checkout@v5
            - uses: actions/setup-node@v5
              with:
                  node-version: ${{ matrix.node }}
                  cache: npm
            - run: npm ci
            - run: npm run build
            # The CLI the integration tests spawn must start from the built output.
            - name: Smoke-test the built CLI
              run: node dist/cli/index.js --version
            - run: npm run test:ci
